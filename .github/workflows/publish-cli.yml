name: Publish CLI to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # Uses npm Trusted Publishing (OIDC). No long-lived NPM_TOKEN required
      # after the GitHub repo is linked on npmjs.com for this package.
      - name: Publish uzbek-humanizer-cli
        run: npm publish --access public --provenance
